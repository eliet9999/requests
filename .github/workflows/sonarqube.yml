name: SonarQube Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonarqube:
    name: Test coverage and SonarQube analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov coverage

      - name: Run limited tests with coverage
        run: |
          pytest tests/test_structures.py --cov=src/requests --cov-report=xml:coverage.xml

      - name: Check coverage report exists
        run: |
          ls -al
          head -n 5 coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
